version: '3.8'

# Local/demo overrides. ASPNETCORE_ENVIRONMENT is deliberately set to
# "Development" here (not "Docker") so Program.cs's
#   if (app.Environment.IsDevelopment()) { db.Database.MigrateAsync(); seeder.RunAsync(); }
# branch actually runs — otherwise the container boots against an empty,
# unmigrated database and every request 500s. If you want a real "Docker"
# environment distinct from "Development" later, that check in Program.cs
# needs to change too, not just this file.

services:
  heroservice.api:
    container_name: heroservice_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80

  heroservice.consumer:
    container_name: heroservice_consumer
    environment:
      - DOTNET_ENVIRONMENT=Development
    restart: unless-stopped