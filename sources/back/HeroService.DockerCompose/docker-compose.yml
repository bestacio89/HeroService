version: '3.8'

services:
  # ---------------------------------------------------------
  # Postgres (matches Database.Provider: Postgres in appsettings.json)
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    environment:
      POSTGRES_DB: GameProject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Bl@dg3r$$"
    ports:
      - "5432:5432"
    volumes:
      - heroservice_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------
  # Redis (Snapshot caching — see Franz.Common.Caching "Caching" section)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------
  # Zookeeper (required by Kafka in this image)
  # ---------------------------------------------------------
  zookeeper:
    image: wurstmeister/zookeeper:latest
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # ---------------------------------------------------------
  # Kafka broker (used by HeroService.Consumer)
  # ---------------------------------------------------------
  kafka:
    image: wurstmeister/kafka:latest
    hostname: kafka
    ports:
      - "9093:9093"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_LISTENER_NAME_INTERNAL: INSIDE
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper

  # ---------------------------------------------------------
  # HeroService API
  # ---------------------------------------------------------
  heroservice.api:
    image: ${DOCKER_REGISTRY-}heroserviceapi
    build:
      context: ../../..
      dockerfile: sources/back/HeroService.API/Dockerfile
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------
  # HeroService Consumer
  # ---------------------------------------------------------
  heroservice.consumer:
    image: ${DOCKER_REGISTRY-}heroserviceconsumer
    build:
      context: ../../..
      dockerfile: sources/back/HeroService.Consumer/Dockerfile
    depends_on:
      - kafka
      - postgres

volumes:
  heroservice_postgres_data: