<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOBA Manga — Roster & Vote</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface2: #f0f1f5;
    --surface3: #e8eaf0;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.15);
    --text: #1a1a2e;
    --muted: #5a5a78;
    --subtle: #9090aa;
    --accent: #4a6ef5;
    --tank: #1a7fe8;
    --fighter: #e8501a;
    --assassin: #7c5ce8;
    --mage: #0faa6a;
    --support: #2da84a;
    --marksman: #c89010;
    --voted: #16a34a;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    padding: 24px 32px 0;
    border-bottom: 1px solid var(--border);
    background: #ffffff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    font-family: 'Rajdhani', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text);
  }

  .logo span { color: var(--accent); }

  .vote-summary {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--muted);
  }

  .vote-count {
    background: var(--surface3);
    border: 1px solid var(--border2);
    padding: 6px 14px;
    border-radius: 999px;
    color: var(--text);
    font-weight: 500;
  }

  .vote-count span { color: var(--voted); font-weight: 700; }

  .btn-reset {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 12px;
    transition: all .15s;
    font-family: 'Inter', sans-serif;
  }

  .btn-reset:hover { border-color: #ef4444; color: #ef4444; }

  .btn-results {
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 6px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    transition: opacity .15s;
  }

  .btn-results:hover { opacity: 0.85; }

  /* TABS */
  .cat-tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
  }

  .cat-tab {
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    background: transparent;
    border: none;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all .15s;
    position: relative;
  }

  .cat-tab:hover { color: var(--text); }

  .cat-tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .cat-tab .tab-votes {
    display: inline-block;
    margin-left: 6px;
    background: var(--voted);
    color: #000;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 999px;
    vertical-align: middle;
  }

  .cat-tab .tab-votes.hidden { display: none; }

  /* CONTENT */
  .content {
    padding: 24px 32px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .cat-header {
    margin-bottom: 20px;
  }

  .cat-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .cat-desc {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* GRID */
  .hero-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 12px;
  }

  /* HERO CARD — exact format from image */
  .hero-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color .15s, transform .1s;
    position: relative;
  }

  .hero-card:hover {
    border-color: var(--border2);
    transform: translateY(-1px);
  }

  .hero-card.voted {
    border-color: var(--voted);
  }

  .voted-ribbon {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--voted);
    color: #000;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    display: none;
  }

  .hero-card.voted .voted-ribbon { display: block; }

  /* Card Header */
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .hero-info { flex: 1; }

  .hero-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.2;
  }

  .hero-origin {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }

  .hero-origin em { font-style: italic; }

  .role-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 4px;
    margin-top: 5px;
  }

  /* Card Body */
  .card-body { padding: 12px 16px 14px; }

  .stats-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .stat-pill {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 4px;
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .basic-atk {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .basic-atk strong {
    color: var(--text);
    font-weight: 600;
  }

  /* Attack rows — exact card format */
  .atk-list { display: flex; flex-direction: column; gap: 8px; }

  .atk-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .atk-key {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Rajdhani', sans-serif;
    flex-shrink: 0;
    border: 1px solid transparent;
  }

  .atk-body { flex: 1; }

  .atk-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .ult-tag {
    font-size: 9px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 3px;
    letter-spacing: 0.5px;
  }

  .atk-desc {
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.5;
    margin-top: 2px;
  }

  /* Vote button */
  .card-footer {
    padding: 0 16px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .vote-count-card {
    font-size: 12px;
    color: var(--muted);
  }

  .vote-count-card span {
    color: var(--voted);
    font-weight: 700;
  }

  .btn-vote {
    padding: 7px 20px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all .15s;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--muted);
  }

  .btn-vote:hover {
    background: var(--surface3);
    color: var(--text);
  }

  .btn-vote.active {
    background: var(--voted);
    border-color: var(--voted);
    color: #000;
    font-weight: 700;
  }

  /* RESULTS MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    overflow-y: auto;
    padding: 40px 20px;
  }

  .modal-overlay.show { display: block; }

  .modal {
    background: #ffffff;
    border: 1px solid var(--border2);
    border-radius: 14px;
    max-width: 720px;
    margin: 0 auto;
    padding: 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .modal-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    font-weight: 700;
  }

  .btn-close {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--muted);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
  }

  .result-cat {
    margin-bottom: 20px;
  }

  .result-cat-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .result-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 0;
    font-size: 13px;
  }

  .result-name {
    flex: 1;
    font-weight: 500;
  }

  .result-bar-wrap {
    width: 120px;
    height: 6px;
    background: var(--surface3);
    border-radius: 3px;
    overflow: hidden;
  }

  .result-bar {
    height: 100%;
    background: var(--voted);
    border-radius: 3px;
    transition: width .4s;
  }

  .result-votes {
    font-size: 12px;
    color: var(--muted);
    min-width: 20px;
    text-align: right;
  }

  .result-votes.has-votes {
    color: var(--voted);
    font-weight: 700;
  }

  .empty-results {
    text-align: center;
    color: var(--muted);
    padding: 32px;
    font-size: 14px;
  }

  /* Color helpers per category */
  .c-tank { color: var(--tank); }
  .c-fighter { color: var(--fighter); }
  .c-assassin { color: var(--assassin); }
  .c-mage { color: var(--mage); }
  .c-support { color: var(--support); }
  .c-marksman { color: var(--marksman); }

  @media (max-width: 600px) {
    .header { padding: 16px; }
    .content { padding: 16px; }
    .hero-grid { grid-template-columns: 1fr; }
    .header-top { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">MOBA <span>MANGA</span> — Roster</div>
    <div class="vote-summary">
      <div class="vote-count">Votes : <span id="total-votes">0</span></div>
      <button class="btn-reset" onclick="resetVotes()">Réinitialiser</button>
      <button class="btn-results" onclick="showResults()">Voir les résultats ↗</button>
    </div>
  </div>
  <div class="cat-tabs" id="cat-tabs"></div>
</div>

<div class="content">
  <div class="cat-header">
    <div class="cat-title" id="cat-title"></div>
    <div class="cat-desc" id="cat-desc"></div>
  </div>
  <div class="hero-grid" id="hero-grid"></div>
</div>

<!-- Results Modal -->
<div class="modal-overlay" id="modal" onclick="hideResults(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Résultats du vote</div>
      <button class="btn-close" onclick="hideResults()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

// Vote state
let votes = {};
let activeCat = 'tank';

function catColor(cat) { return CATS[cat].color; }

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}

function roleBadgeStyle(cat) {
  const colors = {
    tank:     '#dbeafe:#1a7fe8',
    fighter:  '#fee2d5:#e8501a',
    assassin: '#ede9fe:#7c5ce8',
    mage:     '#d1fae5:#0faa6a',
    support:  '#dcfce7:#2da84a',
    marksman: '#fef3c7:#c89010'
  };
  const [bg, col] = colors[cat].split(':');
  return `background:${bg};color:${col};border:1px solid ${col}44`;
}

function atkKeyStyle(cat, isUlt) {
  const colors = { tank:'#1a7fe8', fighter:'#e8501a', assassin:'#7c5ce8', mage:'#0faa6a', support:'#2da84a', marksman:'#c89010' };
  const c = colors[cat];
  return isUlt
    ? `background:${c}18;color:${c};border:1px solid ${c}66`
    : `background:#f0f1f5;color:#5a5a78;border:1px solid #d0d0e0`;
}

function ultTagStyle(cat) {
  const colors = { tank:'#1a7fe8', fighter:'#e8501a', assassin:'#7c5ce8', mage:'#0faa6a', support:'#2da84a', marksman:'#c89010' };
  const c = colors[cat];
  return `background:${c}15;color:${c};border:1px solid ${c}55`;
}

function totalVotesInCat(cat) {
  return HEROES[cat].filter(h => votes[h.id]).length;
}

function renderTabs() {
  document.getElementById('cat-tabs').innerHTML = Object.entries(CATS).map(([k,v]) => {
    const n = totalVotesInCat(k);
    return `<button class="cat-tab ${k===activeCat?'active':''}" onclick="selectCat('${k}')">
      ${v.emoji} ${v.label}
      <span class="tab-votes ${n===0?'hidden':''}">${n}</span>
    </button>`;
  }).join('');
}

function renderGrid() {
  const cv = CATS[activeCat];
  document.getElementById('cat-title').innerHTML = `<span style="color:${cv.color}">${cv.emoji}</span> ${cv.label}`;
  document.getElementById('cat-desc').textContent = cv.desc;

  document.getElementById('hero-grid').innerHTML = HEROES[activeCat].map(h => {
    const voted = !!votes[h.id];
    const vcount = votes[h.id] || 0;
    return `<div class="hero-card ${voted?'voted':''}" id="card-${h.id}">
      <span class="voted-ribbon">✓ Sélectionné</span>
      <div class="card-header">
        <div class="av" style="background:${catColor(activeCat)}22;color:${catColor(activeCat)}">${getInitials(h.name)}</div>
        <div class="hero-info">
          <div class="hero-name">${h.name}</div>
          <div class="hero-origin">${h.from} · <em>${h.why}</em></div>
          <span class="role-badge" style="${roleBadgeStyle(activeCat)}">${cv.label}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="stats-row">${h.stats.map(s=>`<span class="stat-pill">${s}</span>`).join('')}</div>
        <div class="basic-atk"><strong>Attaque basique :</strong> ${h.basic}</div>
        <div class="atk-list">
          ${h.atk.map(a => `
            <div class="atk-row">
              <div class="atk-key" style="${atkKeyStyle(activeCat, a.u)}">${a.k}</div>
              <div class="atk-body">
                <div class="atk-name">
                  ${a.n}
                  ${a.u ? `<span class="ult-tag" style="${ultTagStyle(activeCat)}">ULTIME</span>` : ''}
                </div>
                <div class="atk-desc">${a.d}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>
      <div class="card-footer">
        <div class="vote-count-card">${vcount > 0 ? `<span>${vcount}</span> vote${vcount>1?'s':''}` : '&nbsp;'}</div>
        <button class="btn-vote ${voted?'active':''}" onclick="toggleVote('${h.id}')">
          ${voted ? '✓ Sélectionné' : '+ Voter'}
        </button>
      </div>
    </div>`;
  }).join('');

  updateTotalCount();
}

function selectCat(cat) {
  activeCat = cat;
  renderTabs();
  renderGrid();
}

function toggleVote(id) {
  if (votes[id]) {
    delete votes[id];
  } else {
    votes[id] = 1;
  }
  renderTabs();
  renderGrid();
}

function updateTotalCount() {
  document.getElementById('total-votes').textContent = Object.keys(votes).length;
}

function resetVotes() {
  if (confirm('Réinitialiser tous les votes ?')) {
    votes = {};
    renderTabs();
    renderGrid();
  }
}

function showResults() {
  const allVoted = Object.keys(votes);
  const modal = document.getElementById('modal-body');

  if (allVoted.length === 0) {
    modal.innerHTML = '<div class="empty-results">Aucun vote enregistré pour le moment.</div>';
  } else {
    modal.innerHTML = Object.entries(CATS).map(([catKey, catVal]) => {
      const catHeroes = HEROES[catKey];
      const rows = catHeroes.map(h => {
        const v = votes[h.id] || 0;
        const max = 1;
        return `<div class="result-row">
          <div class="result-name" style="${v>0?'color:var(--text);font-weight:600':'color:var(--muted)'}">${h.name}</div>
          <div style="font-size:11px;color:var(--subtle);flex:0 0 80px;font-style:italic">${h.from}</div>
          <div class="result-bar-wrap"><div class="result-bar" style="width:${v*100}%"></div></div>
          <div class="result-votes ${v>0?'has-votes':''}">${v>0?'✓':''}</div>
        </div>`;
      }).join('');
      const catVotes = catHeroes.filter(h=>votes[h.id]).length;
      return `<div class="result-cat">
        <div class="result-cat-title" style="color:${catVal.color}">${catVal.emoji} ${catVal.label} — ${catVotes} sélectionné${catVotes>1?'s':''}</div>
        ${rows}
      </div>`;
    }).join('');
  }

  document.getElementById('modal').classList.add('show');
}

function hideResults(e) {
  if (!e || e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('show');
  }
}

// Init
renderTabs();
renderGrid();
</script>
