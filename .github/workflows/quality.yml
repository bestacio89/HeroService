name: HeroService quality gates

on:
  push:
    branches:
      - Develop
      - Develop_Unity_V1
  pull_request:
    branches:
      - Develop
      - Develop_Unity_V1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-service-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_CONFIGURATION: Release

jobs:
  build-and-test:
    name: Restore, build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore from NuGet.org
        run: dotnet restore HeroService.slnx --source https://api.nuget.org/v3/index.json

      - name: Build solution
        id: build
        run: dotnet build HeroService.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run unit and architecture tests
        run: >
          dotnet test HeroService.slnx
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --filter "Category!=Integration&Category!=E2E"
          --logger "trx"
          --results-directory TestResults/Unit

      - name: Run container-backed integration tests
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: >
          dotnet test HeroService.slnx
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --filter "Category=Integration"
          --logger "trx"
          --results-directory TestResults/Integration

      - name: Install Chromium for admin browser tests
        run: pwsh tests/HeroService.Testing.Admin.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start admin application
        run: |
          mkdir -p TestResults/AdminE2E
          nohup dotnet sources/Front/HeroService.Admin/bin/Release/net10.0/HeroService.Admin.dll > /tmp/hero-admin.log 2>&1 &
          echo $! > /tmp/hero-admin.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5062/ > /dev/null; then
              echo "HeroService.Admin is ready."
              exit 0
            fi

            sleep 2
          done

          cat /tmp/hero-admin.log
          exit 1
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5062
          HeroService__BaseUrl: http://127.0.0.1:5999

      - name: Run admin browser, accessibility and performance tests
        run: >
          dotnet test tests/HeroService.Testing.Admin.E2E/HeroService.Testing.Admin.E2E.csproj
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --filter "Category=E2E"
          --logger "trx"
          --results-directory TestResults/AdminE2E
        env:
          ADMIN_BASE_URL: http://127.0.0.1:5062/
          ADMIN_DIAGNOSTICS_DIRECTORY: TestResults/AdminE2E/Screenshots
          ADMIN_PERFORMANCE_RESULTS_PATH: TestResults/AdminE2E/performance.json

      - name: Stop admin application and collect logs
        if: always()
        run: |
          mkdir -p TestResults/AdminE2E

          if [ -f /tmp/hero-admin.log ]; then
            cp /tmp/hero-admin.log TestResults/AdminE2E/hero-admin.log
          fi

          if [ -f /tmp/hero-admin.pid ]; then
            kill "$(cat /tmp/hero-admin.pid)" || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload admin browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-diagnostics
          path: TestResults/AdminE2E/**
          if-no-files-found: warn
          retention-days: 14
