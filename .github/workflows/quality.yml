name: HeroService quality gates

on:
  push:
    branches:
      - Develop
      - Develop_Unity_V1
  pull_request:
    branches:
      - Develop
      - Develop_Unity_V1
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release

jobs:
  build-and-test:
    name: Restore, build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore from NuGet.org
        run: dotnet restore HeroService.slnx --source https://api.nuget.org/v3/index.json

      - name: Build solution
        run: dotnet build HeroService.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
        run: >
          dotnet test HeroService.slnx
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=hero-service-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
